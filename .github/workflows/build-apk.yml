name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: UbuntuVMApp

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      working-directory: UbuntuVMApp

    - name: Find and copy APK
      run: |
        mkdir -p bin
        find UbuntuVMApp -name "*.apk" -exec cp {} bin/UbuntuVMApp-debug.apk \;
        ls -la bin/

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UbuntuVMApp-debug.apk
        path: bin/UbuntuVMApp-debug.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: Release v1.0.0 - Ubuntu VM Android App
        draft: false
        prerelease: false
        files: bin/UbuntuVMApp-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: UbuntuVMApp

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      working-directory: UbuntuVMApp

    - name: Find and copy APK
      run: |
        mkdir -p bin
        find UbuntuVMApp -name "*.apk" -exec cp {} bin/UbuntuVMApp-debug.apk \;
        ls -la bin/

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UbuntuVMApp-debug.apk
        path: bin/UbuntuVMApp-debug.apk

    - name: Upload APK to GitHub Release
      run: |
        gh release upload v1.0.0 bin/UbuntuVMApp-debug.apk --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
